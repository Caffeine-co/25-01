[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldlife-next"
version = "1.0.0"
description = "Auditable event-driven virtual characters, built on the world-preview WorldLife design"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
worldlife = "simlife.cli:main"

[tool.setuptools.packages.find]
include = ["simlife*"]
