[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldlife-starter"
version = "0.1.0"
description = "Configurable deterministic world-life simulation starter"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
worldlife = "simlife.cli:main"

[tool.setuptools.packages.find]
include = ["simlife*"]
