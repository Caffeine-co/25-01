[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldlife-starter"
version = "0.5.0"
description = "Deterministic World-Life simulation with local beliefs, persistent goals, and event execution"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
worldlife = "simlife.cli:main"

[tool.setuptools.packages.find]
include = ["simlife*"]
